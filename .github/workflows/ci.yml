name: PetMatching CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # Job 1: Kiểm thử và Build Backend (NestJS + Prisma)
  # ========================================================
  server-ci:
    name: Backend CI (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Cài đặt thư viện Backend
        working-directory: ./server
        run: npm install

      - name: Khởi tạo Prisma Client
        working-directory: ./server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/petmatching?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/petmatching?schema=public"
        run: npx prisma generate

      - name: Chạy Unit Tests Backend
        working-directory: ./server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/petmatching?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/petmatching?schema=public"
          JWT_SECRET: "ci-jwt-test-secret-key-1234567890"
        run: npm test

      - name: Biên dịch NestJS (Build)
        working-directory: ./server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/petmatching?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/petmatching?schema=public"
        run: npm run build

  # ========================================================
  # Job 2: Kiểm tra và Build Frontend (Next.js)
  # ========================================================
  client-ci:
    name: Frontend CI (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cài đặt thư viện Frontend
        working-directory: ./client
        run: npm install

      - name: Biên dịch Next.js (Build)
        working-directory: ./client
        env:
          NEXT_PUBLIC_API_URL: "/api"
        run: npm run build

  # ========================================================
  # Job 3: Triển khai tự động lên Production VPS qua SSH
  # (Chỉ kích hoạt khi push lên branch main hoặc chạy thủ công)
  # ========================================================
  deploy:
    name: Deploy to Production VPS
    needs: [server-ci, client-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Triển khai lên VPS qua SSH bằng Password
        if: "${{ secrets.VPS_PASSWORD != '' }}"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "[PetMatching CD] Đang cập nhật mã nguồn mới nhất trên VPS..."
            cd /opt/petmatching
            git fetch origin main
            git reset --hard origin/main

            echo "[PetMatching CD] Rebuild và cập nhật Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "[PetMatching CD] Thu hồi Docker images cũ không sử dụng..."
            docker image prune -f

            echo "[PetMatching CD] Kiểm tra trạng thái containers sau triển khai..."
            docker compose -f docker-compose.prod.yml ps

            echo "[PetMatching CD] Triển khai thành công!"

      - name: Triển khai lên VPS qua SSH bằng SSH Key
        if: "${{ secrets.VPS_PASSWORD == '' && secrets.VPS_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "[PetMatching CD] Đang cập nhật mã nguồn mới nhất trên VPS..."
            cd /opt/petmatching
            git fetch origin main
            git reset --hard origin/main

            echo "[PetMatching CD] Rebuild và cập nhật Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "[PetMatching CD] Thu hồi Docker images cũ không sử dụng..."
            docker image prune -f

            echo "[PetMatching CD] Kiểm tra trạng thái containers sau triển khai..."
            docker compose -f docker-compose.prod.yml ps

            echo "[PetMatching CD] Triển khai thành công!"

